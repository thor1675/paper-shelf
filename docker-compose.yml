services:
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    # 127.0.0.1 に限定する。付けないと同じネットワーク（LAN）の誰からでも開ける
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_URL=http://backend:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # OpenAlex の「丁寧な利用者」の枠に入るための連絡先（任意）
      - OPENALEX_MAILTO=${OPENALEX_MAILTO:-}
      - TRANSLATOR_URL=http://translator:8001
      # slackbot からの操作を受け付けるための合言葉（slackbot と同じ値）
      - BOT_TOKEN=${BOT_TOKEN:-}
      # GitHub でのログイン（OAuth2）。GitHub の OAuth App の値。空なら「GitHub でログイン」は出ない
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - PUBLIC_API_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    # slackbot が起動直後のメッセージで失敗しないよう、API が応答するかを確かめる
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # 英→日の翻訳（Hugging Face の FuguMT を CPU で動かす）。backend からだけ使うのでポートは外に出さない
  translator:
    build: ./translator
    volumes:
      - ./translator/app.py:/app/app.py
      - ./translator/tests:/app/tests
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  slackbot:
    build: ./slackbot
    volumes:
      - ./slackbot:/app
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      # 新着を知らせるチャンネルの ID（C から始まる）と時刻（日本時間）
      - SLACK_NOTIFY_CHANNEL=${SLACK_NOTIFY_CHANNEL:-}
      - NOTIFY_HOUR=${NOTIFY_HOUR:-9}
      - API_URL=http://backend:8000
      - BOT_TOKEN=${BOT_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    # トークン未設定なら正常終了（再起動しない）、異常終了なら再起動
    restart: on-failure

  db:
    image: postgres:18.6
    volumes:
      - db-data:/var/lib/postgresql
    # DB は認証の無いアプリの裏にあるので、外から直接つながらないよう 127.0.0.1 に限定する
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
